<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maurice wordt 50!</title>
<style>
  :root {
    --gold: #f5c542;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at top, #1e2a4a, #0b1024 70%);
    color: #fff;
    overflow: hidden;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    position: relative;
    z-index: 2;
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    margin: 0 0 8px;
    color: var(--gold);
    text-shadow: 0 2px 12px rgba(245,197,66,0.4);
  }
  .subtitle {
    font-size: clamp(1rem, 2.2vw, 1.3rem);
    margin-bottom: 40px;
    opacity: 0.85;
  }
  .countdown {
    display: flex;
    gap: clamp(10px, 3vw, 28px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .unit {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(245,197,66,0.3);
    border-radius: 16px;
    padding: clamp(14px, 3vw, 26px) clamp(14px, 3vw, 22px);
    min-width: 90px;
    backdrop-filter: blur(4px);
  }
  .unit .num {
    font-size: clamp(2rem, 7vw, 3.8rem);
    font-weight: 700;
    color: #fff;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .unit .label {
    margin-top: 8px;
    font-size: clamp(0.7rem, 1.6vw, 0.95rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .date-line {
    margin-top: 36px;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    opacity: 0.7;
  }
  .done {
    display: none;
    text-align: center;
  }
  .done h1 { font-size: clamp(2.2rem, 7vw, 4.5rem); }
  .done p { font-size: clamp(1rem, 2.5vw, 1.4rem); opacity: 0.85; }
  canvas#confetti {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
  }
  .sparkle {
    position: absolute;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.5;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.8); }
    50% { opacity: 0.7; transform: scale(1.2); }
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>🎉 Maurice wordt 50!</h1>
  <div class="subtitle">Aftellen naar 9 maart 2028</div>

  <div class="countdown" id="countdown">
    <div class="unit"><div class="num" id="days">0</div><div class="label">Dagen</div></div>
    <div class="unit"><div class="num" id="hours">0</div><div class="label">Uren</div></div>
    <div class="unit"><div class="num" id="minutes">0</div><div class="label">Minuten</div></div>
    <div class="unit"><div class="num" id="seconds">0</div><div class="label">Seconden</div></div>
  </div>

  <div class="date-line">9 maart 2028 — de dag dat Maurice 50 wordt</div>

  <div class="done" id="done">
    <h1>🥳 Het is zover!</h1>
    <p>Maurice is vandaag 50 geworden. Gefeliciteerd!</p>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
  var targetDate = new Date("2028-03-09T00:00:00");

  function pad(n) { return n < 10 ? "0" + n : n; }

  function updateCountdown() {
    var now = new Date();
    var diff = targetDate - now;

    if (diff <= 0) {
      document.getElementById("countdown").style.display = "none";
      document.querySelector(".date-line").style.display = "none";
      document.getElementById("done").style.display = "block";
      startConfetti();
      return;
    }

    var days = Math.floor(diff / (1000 * 60 * 60 * 24));
    var hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    var minutes = Math.floor((diff / (1000 * 60)) % 60);
    var seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = pad(hours);
    document.getElementById("minutes").textContent = pad(minutes);
    document.getElementById("seconds").textContent = pad(seconds);
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // subtle floating sparkles in background
  (function addSparkles() {
    for (var i = 0; i < 25; i++) {
      var s = document.createElement("div");
      s.className = "sparkle";
      var size = Math.random() * 4 + 2;
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "vw";
      s.style.top = Math.random() * 100 + "vh";
      s.style.animationDelay = (Math.random() * 3) + "s";
      document.body.appendChild(s);
    }
  })();

  // simple confetti burst, only triggered when countdown reaches zero
  function startConfetti() {
    var canvas = document.getElementById("confetti");
    var ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    var colors = ["#f5c542", "#ffffff", "#ff6b6b", "#4dd0e1", "#9575cd"];
    var pieces = [];
    for (var i = 0; i < 150; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        speed: Math.random() * 3 + 2,
        drift: Math.random() * 2 - 1,
        rotation: Math.random() * 360
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(function(p) {
        p.y += p.speed;
        p.x += p.drift;
        p.rotation += 2;
        if (p.y > canvas.height) p.y = -10;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });
      requestAnimationFrame(draw);
    }
    draw();

    window.addEventListener("resize", function() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  }
</script>

</body>
</html>
